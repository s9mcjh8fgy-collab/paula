<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700&display=swap">
<style>
@font-face{font-family:Borna;src:url(borna.otf);font-weight:700}
*{margin:0;box-sizing:border-box}
body{width:1200px;height:1200px;background:#6D413E;color:#F1EBDF;font-family:Inter,sans-serif;position:relative;overflow:hidden}
.k{position:absolute;left:96px;top:96px;font-size:30px;letter-spacing:.24em;text-transform:uppercase;color:#F26F4D;font-weight:700}
h1{position:absolute;left:90px;top:170px;font-family:Borna;font-size:168px;line-height:.95}
h1 em{font-style:normal;color:#F26F4D}
p{position:absolute;left:96px;top:520px;font-size:38px;line-height:1.35;color:#E3D6C6;width:900px}
.shot{position:absolute;left:96px;top:700px;width:1150px;border-radius:18px;box-shadow:0 30px 70px rgba(0,0,0,.4)}
.ruler{position:absolute;left:0;right:0;bottom:0;height:70px;display:flex;align-items:flex-end;background:#6D413E;border-bottom:4px solid #F1EBDF}
.ruler i{flex:1;border-left:2px solid rgba(241,235,223,.55);height:16px}
.ruler i:nth-child(5n+1){height:34px}.ruler i:nth-child(10n+1){height:58px;border-color:#F26F4D}
</style></head><body>
<div class="k">Estrutura Legal</div>
<h1>Contrato<br>na <em>Régua</em></h1>
<p>Da proposta aprovada ao contrato de projeto de arquitetura, em Word, com a sua logo.</p>
<img class="shot" src="app-visao.jpg">
<div class="ruler" id="r"></div>
<script>document.getElementById('r').innerHTML=new Array(61).join('<i></i>')</script>
</body></html>
