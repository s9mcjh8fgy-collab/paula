<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;0,700;1,600&family=Inter:wght@400;500;600&display=swap');
* { margin:0; padding:0; box-sizing:border-box; }
body {
  width:1920px; height:1080px;
  background:#6D413E;
  font-family:'Inter', sans-serif;
  position:relative;
  overflow:hidden;
}
.dots { position:absolute; top:90px; left:120px; display:flex; gap:14px; }
.dot { width:14px; height:14px; border-radius:50%; background:#F26F4D; }
.wordmark { position:absolute; top:80px; left:120px; margin-top:44px; }
.wordmark .p { font-family:'Fraunces', serif; font-weight:700; font-size:28px; color:#F1EBDF; }
.wordmark .c { font-family:'Fraunces', serif; font-weight:600; font-style:italic; font-size:28px; color:#F1EBDF; }
.wordmark .oab { font-family:'Inter', sans-serif; font-size:13px; letter-spacing:4px; color:#F26F4D; margin-top:2px; }
.content { position:absolute; left:120px; top:400px; width:1200px; }
.kicker { font-family:'Inter', sans-serif; font-size:20px; letter-spacing:6px; color:#F26F4D; margin-bottom:24px; text-transform:uppercase; }
h1 { font-family:'Fraunces', serif; font-weight:700; font-size:96px; color:#F1EBDF; line-height:1.05; }
h1 em { font-style:italic; font-weight:600; color:#F26F4D; }
.sub { font-family:'Inter', sans-serif; font-size:28px; color:#F1EBDF; margin-top:36px; opacity:0.85; }
.meta { position:absolute; left:120px; bottom:90px; font-family:'Inter', sans-serif; font-size:20px; color:#F1EBDF; opacity:0.7; }
.photo { position:absolute; right:0; bottom:0; width:560px; height:1080px; object-fit:cover; opacity:0.9; }
.fade { position:absolute; right:0; bottom:0; width:560px; height:1080px; background:linear-gradient(90deg, #6D413E 0%, rgba(109,65,62,0) 35%); }
</style>
</head>
<body>
  <div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
  <div class="wordmark">
    <div class="p">Paula <span class="c">Corrêa</span></div>
    <div class="oab">A D V O C A C I A</div>
  </div>
  <img class="photo" src="../../marca/fotos/ambiente-02.jpg">
  <div class="fade"></div>
  <div class="content">
    <div class="kicker">Proposta Comercial</div>
    <h1>Propriedade<br><em>Intelectual</em></h1>
    <div class="sub">Simone Dalbosco · Dalbosco Treinamentos &amp; Editora</div>
  </div>
  <div class="meta">Blumenau/SC · Agosto de 2026</div>
</body>
</html>
