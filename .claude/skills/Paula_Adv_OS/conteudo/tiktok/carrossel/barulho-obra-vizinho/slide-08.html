<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px; height: 1920px;
    background: #F1EBDF;
    font-family: 'Inter', sans-serif;
    position: relative;
    overflow: hidden;
  }
  .content {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    padding: 140px 72px 320px 72px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .tag {
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 22px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #F26F4D;
    margin-bottom: 36px;
  }
  .intro {
    font-family: 'Bricolage Grotesque', sans-serif;
    font-weight: 600;
    font-size: 36px;
    line-height: 1.42;
    color: #6D413E;
    margin-bottom: 48px;
  }
  ul { list-style: none; }
  li {
    display: flex;
    align-items: flex-start;
    gap: 24px;
    margin-bottom: 32px;
    font-family: 'Bricolage Grotesque', sans-serif;
    font-weight: 700;
    font-size: 38px;
    line-height: 1.3;
    color: #6D413E;
  }
  .bullet {
    flex-shrink: 0;
    width: 44px; height: 44px;
    border-radius: 50%;
    background: #F26F4D;
    color: #FFFFFF;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    font-weight: 800;
    margin-top: 6px;
  }
  .progress-track {
    position: absolute;
    bottom: 260px; left: 72px; right: 72px;
    height: 3px;
    background: rgba(109,65,62,0.15);
  }
  .progress-fill {
    height: 100%;
    width: 80%;
    background: #F26F4D;
  }
</style>
</head>
<body>
  <div class="content">
    <div class="tag">O que protege de verdade</div>
    <div class="intro">Não é discutir na porta do apartamento. É documentação.</div>
    <ul>
      <li><span class="bullet">1</span> Cronograma da obra por escrito</li>
      <li><span class="bullet">2</span> Horário de início e fim registrado</li>
      <li><span class="bullet">3</span> Aviso prévio pro síndico e pros vizinhos</li>
    </ul>
  </div>
  <div class="progress-track"><div class="progress-fill"></div></div>
</body>
</html>
