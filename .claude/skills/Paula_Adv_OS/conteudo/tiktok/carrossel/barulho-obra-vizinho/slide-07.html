<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px; height: 1920px;
    background: #6D413E;
    font-family: 'Inter', sans-serif;
    position: relative;
    overflow: hidden;
  }
  .content {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    padding: 140px 72px 320px 72px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .tag {
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 22px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #F26F4D;
    margin-bottom: 40px;
  }
  p.intro {
    font-family: 'Bricolage Grotesque', sans-serif;
    font-weight: 600;
    font-size: 38px;
    line-height: 1.42;
    color: #F1EBDF;
    margin-bottom: 48px;
  }
  .card {
    border: 3px solid #F26F4D;
    border-radius: 8px;
    padding: 48px;
  }
  .card p {
    font-family: 'Bricolage Grotesque', sans-serif;
    font-weight: 800;
    font-size: 44px;
    line-height: 1.35;
    color: #F26F4D;
  }
  .progress-track {
    position: absolute;
    bottom: 260px; left: 72px; right: 72px;
    height: 3px;
    background: rgba(241,235,223,0.25);
  }
  .progress-fill {
    height: 100%;
    width: 70%;
    background: #F1EBDF;
  }
</style>
</head>
<body>
  <div class="content">
    <div class="tag">E a polícia?</div>
    <p class="intro">Dentro do horário permitido e do limite técnico de ruído, não existe ordem pra parar a obra só porque alguém ligou reclamando. Quem tem poder de embargar é a prefeitura, por fiscalização, ou uma decisão judicial.</p>
    <div class="card">
      <p>Um boletim de ocorrência sozinho não interrompe reforma nenhuma.</p>
    </div>
  </div>
  <div class="progress-track"><div class="progress-fill"></div></div>
</body>
</html>
