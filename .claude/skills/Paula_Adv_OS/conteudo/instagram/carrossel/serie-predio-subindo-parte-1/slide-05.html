<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1080px;
    height: 1350px;
    background: #F1EBDF;
    color: #6D413E;
    font-family: 'Source Serif 4', serif;
  }
  .wrap {
    width: 1080px;
    height: 1350px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 110px;
  }
  .block { max-width: 880px; text-align: center; }
  p { font-size: 44px; line-height: 1.4; font-weight: 400; }
  p + p { margin-top: 34px; }
  .accent { font-weight: 600; }
  .cover-kicker {
    font-size: 62px; font-style: italic; font-weight: 600; color: #F26F4D;
    margin-bottom: 22px; display: block;
  }
  .cover-title { font-size: 84px; line-height: 1.15; font-weight: 600; }
  .cover-tension { font-size: 52px; font-style: italic; margin-top: 26px; }
  .cover-part {
    margin-top: 70px; font-size: 34px; letter-spacing: 6px; text-transform: uppercase;
    color: #F26F4D; font-weight: 600;
  }
  .continua { font-style: italic; font-size: 40px; color: #F26F4D; }
  .small { font-size: 38px; font-style: italic; opacity: .85; }
</style>
</head>
<body>
  <div class="wrap"><div class="block"><p>Seis, sete, oito... <span class="accent">O prédio estava no 15º andar.</span> Ele parou o carro e ligou pro engenheiro da obra, que não atendeu. Mandou mensagem perguntando se o reforço tinha sido feito. Visualizou e não respondeu.</p></div></div>
</body>
</html>
