<!doctype html>
<html lang="pt-br">
<head><meta charset="utf-8"><style>
  @import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; font-family: 'Source Serif 4', serif; }
  .frame {
    width: 1080px; height: 1350px; position: relative;
    background: url('imagens/ambiente-01.jpg') center center / cover no-repeat;
  }
  .overlay {
    position: absolute; left: 0; right: 0; bottom: 0; height: 46%;
    background: linear-gradient(to top, rgba(30,17,15,.92) 0%, rgba(30,17,15,0) 100%);
    display: flex; align-items: flex-end; justify-content: center;
    padding: 80px 90px;
  }
  .txt { color: #F1EBDF; text-align: center; max-width: 820px; }
  .kicker { font-size: 44px; font-style: italic; color: #F26F4D; }
  p { font-size: 40px; line-height: 1.4; font-weight: 400; }
</style></head>
<body><div class="frame"><div class="overlay"><div class="txt"><p>O que você acha chic no seu trabalho?<br><span class="kicker" style="font-size:34px">Comenta aqui.</span></p></div></div></div></body>
</html>
