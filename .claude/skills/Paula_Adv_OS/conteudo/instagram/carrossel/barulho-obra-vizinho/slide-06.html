<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1080px;
    height: 1350px;
    background: #F1EBDF;
    color: #6D413E;
    font-family: 'Source Serif 4', serif;
  }
  .wrap {
    width: 1080px;
    height: 1350px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 110px;
  }
  .block {
    max-width: 880px;
    text-align: center;
  }
  p {
    font-size: 44px;
    line-height: 1.4;
    font-weight: 400;
  }
  .accent { color: #F26F4D; }
  .cover-kicker {
    font-size: 40px;
    font-style: italic;
    font-weight: 400;
    color: #F26F4D;
    margin-bottom: 18px;
    display: block;
  }
  .cover-title { font-size: 84px; line-height: 1.15; font-weight: 600; }
  .closing p:last-child { margin-top: 34px; font-size: 42px; font-weight: 600; }
  .quote { font-style: italic; }
</style>
</head>
<body>
  <div class="wrap"><div class="block "><p>O vizinho chamou a polícia mesmo assim. Um fiscal apareceu, olhou o relógio, olhou o aviso que Rafael tinha mandado pro condomínio. Não tinha nada de errado. Foi embora, e no dia seguinte a obra seguiu no mesmo horário de sempre.</p></div></div>
</body>
</html>
