<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1080px;
    height: 1350px;
    background: #6D413E;
    color: #F1EBDF;
    font-family: 'Source Serif 4', serif;
  }
  .wrap {
    width: 1080px;
    height: 1350px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 110px;
  }
  .block {
    max-width: 880px;
    text-align: center;
  }
  p {
    font-size: 44px;
    line-height: 1.4;
    font-weight: 400;
  }
  .accent { color: #F26F4D; }
  .closing p:last-child { margin-top: 34px; font-size: 42px; font-weight: 600; }
</style>
</head>
<body>
  <div class="wrap"><div class="block closing"><p style="font-size:38px; font-style: italic; opacity: .85;">Nomes e detalhes trocados pra preservar quem viveu isso de verdade.</p><p>Cliente pode escolher correr o risco.<br>Você só não pode ser quem paga a conta<br>por uma escolha que não foi sua.<br><span class="accent">Documenta.</span></p></div></div>
</body>
</html>
