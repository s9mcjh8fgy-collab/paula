<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; font-family: 'Source Serif 4', serif; }
  .frame {
    width: 1080px; height: 1350px; position: relative;
    background: url('imagens/ensaio-2025-05.jpg') center 20% / cover no-repeat;
  }
  .overlay {
    position: absolute; left: 0; right: 0; bottom: 0; height: 48%;
    background: linear-gradient(to top, rgba(30,17,15,.92) 0%, rgba(30,17,15,0) 100%);
    display: flex; align-items: flex-end; justify-content: center;
    padding: 90px 90px;
  }
  .txt { color: #F1EBDF; text-align: center; max-width: 860px; }
  p { font-size: 52px; line-height: 1.32; font-weight: 600; }
  .accent { color: #F26F4D; font-style: italic; font-weight: 400; font-size: 34px; display: block; margin-top: 16px; }
</style>
</head>
<body>
  <div class="frame"><div class="overlay"><div class="txt">
    <p>Desistir na planta tem custo. Mas tem teto.</p>
    <span class="accent">Advocacia da Construção Civil</span>
  </div></div></div>
</body>
</html>
