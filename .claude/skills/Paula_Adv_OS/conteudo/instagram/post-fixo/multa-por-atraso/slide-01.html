<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: 'Borna'; src: url('../../../../marca/fonts/Borna-Bold.otf'); font-weight: 700; }
  @font-face { font-family: 'Borna'; src: url('../../../../marca/fonts/Borna-Medium.otf'); font-weight: 500; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; font-family: 'Borna', sans-serif; }
  .frame {
    width: 1080px; height: 1350px; position: relative;
    background: url('../../../../marca/fotos/ensaio-2025-09.jpg') 60% 20% / cover no-repeat;
  }
  .overlay {
    position: absolute; left: 0; right: 0; bottom: 0; height: 62%;
    background: linear-gradient(to top, rgba(61,34,31,.97) 0%, rgba(61,34,31,.9) 50%, rgba(61,34,31,.55) 75%, rgba(61,34,31,0) 100%);
    display: flex; align-items: flex-end; justify-content: center;
    padding: 90px 80px;
  }
  .txt { text-align: center; max-width: 920px; }
  .hook { color: #F26F4D; font-weight: 700; font-size: 62px; line-height: 1.15; }
  .sub { color: #F1EBDF; font-weight: 700; font-size: 50px; line-height: 1.2; margin-top: 18px; }
  .tag { color: #F1EBDF; opacity: .8; font-weight: 500; font-size: 26px; letter-spacing: 3px; text-transform: uppercase; display: block; margin-top: 40px; }
</style>
</head>
<body>
  <div class="frame"><div class="overlay"><div class="txt">
    <p class="hook">Multa por atraso mal<br>escrita não protege<br>ninguém.</p>
    <p class="sub">Nem quem contrata,<br>nem quem executa.</p>
    <span class="tag">Advocacia da Construção Civil</span>
  </div></div></div>
</body>
</html>
