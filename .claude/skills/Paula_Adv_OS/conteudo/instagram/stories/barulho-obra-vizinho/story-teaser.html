<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1080px; height: 1920px;
    background: #F26F4D;
    color: #FFFFFF;
    font-family: 'Source Serif 4', serif;
  }
  .frame {
    width: 1080px; height: 1920px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 0 100px;
  }
  .kicker {
    font-size: 44px; font-style: italic; font-weight: 400;
    color: #6D413E; margin-bottom: 24px; display: block;
  }
  .title {
    font-size: 76px; line-height: 1.18; font-weight: 600; text-align: center;
  }
  .cta-block {
    position: absolute; left: 0; right: 0; bottom: 330px;
    display: flex; justify-content: center;
  }
  .cta {
    font-size: 40px; line-height: 1.4; text-align: center; max-width: 780px;
    font-style: italic; color: #FFFFFF;
  }
  .cta strong { display: block; font-style: normal; font-weight: 600; margin-bottom: 10px; color: #6D413E; }
</style>
</head>
<body>
  <div class="frame">
    <span class="kicker">Era uma vez...</span>
    <div class="title">um vizinho que jurou<br>chamar a polícia</div>
  </div>
  <div class="cta-block">
    <div class="cta"><strong>Primeira história da série.</strong>Já tá no feed, vem ler.</div>
  </div>
</body>
</html>
