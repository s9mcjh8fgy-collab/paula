<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px;
    height: 630px;
    background: #6D413E;
    font-family: 'Inter', sans-serif;
    position: relative;
    overflow: hidden;
  }
  .accent-bar {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 14px;
    background: #F26F4D;
  }
  .content {
    padding: 90px 100px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    height: 100%;
  }
  .eyebrow {
    font-family: 'Inter', sans-serif;
    font-size: 20px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #F26F4D;
    margin-bottom: 28px;
  }
  h1 {
    font-family: 'Bricolage Grotesque', sans-serif;
    font-weight: 800;
    font-size: 56px;
    line-height: 1.18;
    color: #F1EBDF;
    max-width: 920px;
  }
  .footer {
    position: absolute;
    bottom: 60px;
    left: 100px;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .logo-circle {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: #F26F4D;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Bricolage Grotesque', sans-serif;
    font-weight: 800;
    font-size: 20px;
    color: #FFFFFF;
  }
  .brand-name {
    font-size: 20px;
    font-weight: 600;
    color: #F1EBDF;
  }
</style>
</head>
<body>
  <div class="accent-bar"></div>
  <div class="content">
    <div class="eyebrow">Advocacia da Construção Civil</div>
    <h1>Contrato de empreitada: o que precisa ter pra proteger construtora e cliente</h1>
  </div>
  <div class="footer">
    <div class="logo-circle">PC</div>
    <div class="brand-name">Paula Corrêa Advocacia</div>
  </div>
</body>
</html>
